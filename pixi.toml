[workspace]
authors = ["Uri Neri <uri.neri@gmail.com>"]
channels = ["conda-forge"]
name = "FossPulser"
platforms = ["linux-64"]
version = "0.2.0"

[dependencies]
python = ">=3.11,<3.13"
hdf5 = ">=2.2.0,<3"
zstd = ">=1.5.7,<2"
gzip = ">=1.15,<2"
make = ">=4.4.1,<5"
cmake = ">=4.5.0,<5"
gcc = ">=16.2.0,<16.3"
ninja = ">=1.13.2,<2"
libxkbcommon = ">=1.6,<2"
wayland = ">=1.22,<2"
libxcb = ">=1.17,<2"
gcc_win-64 = ">=16.2.0,<17"
gxx_win-64 = ">=16.2.0,<17"
rust-std-x86_64-pc-windows-gnu = ">=1.100.0,<2"

[tasks.fetch-data]
cmd = "python -m pipeline fetch --preset eastern-mediterranean"
description = "Fetch and build the local Eastern Mediterranean bundle"

[tasks.build-frames]
cmd = "python pipeline/build_all.py"
description = "Build layers for the current request and local bundle"

[tasks.pipeline]
cmd = "python -m pipeline fetch --preset eastern-mediterranean"
description = "Run the request-driven data and render pipeline"

[tasks.app-build]
# The gcc_win-64 package's activation exports CC/CXX/AR pointing at the
# x86_64-w64-mingw32 cross toolchain, which would make native C build scripts
# (e.g. blake3's) emit Windows COFF objects the Linux linker can't use. Point
# the C toolchain back at the conda Linux compilers for the native build; the
# Windows cross build pins its own linker per-target in app/.cargo/config.toml.
cmd = """
env CC=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc \
    CXX=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++ \
    AR=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-ar \
    cargo build --release --manifest-path app/Cargo.toml
"""
description = "Build the Rune desktop app (native Linux release)"

[tasks.app-run]
cmd = """
env CC=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-cc \
    CXX=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-c++ \
    AR=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-ar \
    cargo run --release --manifest-path app/Cargo.toml
"""
description = "Run the Rune FossPulser app (native Linux release)"

[pypi-dependencies]
requests = ">=2.32,<3"
numpy = ">=2.1,<3"
rasterio = ">=1.4,<2"
scipy = ">=1.15,<2"
matplotlib = ">=3.10,<4"
pillow = ">=11,<14"
netcdf4 = ">=1.7,<2"
xarray = ">=2025.1,<2027"
pyshp = ">=2.3,<3"
copernicusmarine = ">=2.5.1,<3"
forge3d = { version = ">=1.49.0,<2", extras = ["raster"] }
pytest = ">=8,<10"
